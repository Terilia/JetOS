<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="square">
  <!-- Negative (dive) ladder rung. Dashed bar + end ticks pointing UP toward horizon. -->
  <!-- Left dashes -->
  <line x1="40" y1="128" x2="55" y2="128"/>
  <line x1="65" y1="128" x2="80" y2="128"/>
  <line x1="90" y1="128" x2="105" y2="128"/>
  <!-- Left end tick UP -->
  <line x1="40" y1="128" x2="40" y2="96"/>
  <!-- Right dashes -->
  <line x1="151" y1="128" x2="166" y2="128"/>
  <line x1="176" y1="128" x2="191" y2="128"/>
  <line x1="201" y1="128" x2="216" y2="128"/>
  <!-- Right end tick UP -->
  <line x1="216" y1="128" x2="216" y2="96"/>
</svg>
