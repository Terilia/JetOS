<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke="#FFFFFF" stroke-width="14">
  <!-- Sparse 45° diagonal hatch — for small damage / no-data overlay regions.
       Wide spacing (~64px) so when stretched into a small bar slot the lines
       remain visible as individual strokes rather than blending into a fill. -->
  <line x1="-32" y1="64"  x2="64"  y2="-32"/>
  <line x1="-32" y1="160" x2="160" y2="-32"/>
  <line x1="-32" y1="256" x2="256" y2="-32"/>
  <line x1="64"  y1="288" x2="288" y2="64"/>
  <line x1="160" y1="288" x2="288" y2="160"/>
</svg>
