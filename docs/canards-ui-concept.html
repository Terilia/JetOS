<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JetOS Canards MFD Concept</title>
  <style>
    :root {
      --bg: #050805;
      --panel: #071008;
      --panel2: #09140a;
      --line: #314b35;
      --line-bright: #5f7d5d;
      --gold: #9a8856;
      --gold-dim: #5f5638;
      --text: #80bd80;
      --dim: #466b46;
      --hot: #a6ee9c;
      --warn: #d4ad54;
      --left: #9be69a;
      --right: #d7bc6c;
      --neutral: #526d52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020402;
      color: var(--text);
      font-family: "Bahnschrift", "Aptos", sans-serif;
      letter-spacing: 0;
    }

    .mfd {
      width: min(96vw, 980px);
      aspect-ratio: 1.62 / 1;
      min-height: 520px;
      position: relative;
      overflow: hidden;
      background: var(--bg);
      border: 2px solid var(--line);
      box-shadow: 0 18px 70px rgba(0,0,0,.72), inset 0 0 50px rgba(70,150,70,.08);
    }

    .mfd::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(110,160,110,.034) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110,160,110,.025) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    header, footer {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 3;
      background: rgba(6,14,7,.96);
      display: flex;
      align-items: center;
      padding: 0 22px;
    }

    header {
      top: 10px;
      height: 52px;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 0 var(--gold-dim);
    }

    footer {
      bottom: 0;
      height: 42px;
      border-top: 1px solid var(--line);
      justify-content: space-between;
      color: var(--dim);
      font-size: 18px;
    }

    .brand {
      color: var(--gold);
      font-weight: 800;
      font-size: 25px;
      min-width: 210px;
    }

    .sys {
      color: var(--dim);
      font-size: 17px;
      flex: 1;
    }

    .page {
      color: var(--dim);
      font-size: 18px;
    }

    main {
      position: absolute;
      inset: 74px 18px 50px;
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 14px;
      z-index: 2;
    }

    .menu-stack {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      min-width: 0;
    }

    .menu-list {
      display: grid;
      grid-template-rows: repeat(3, 42px);
      border-top: 1px solid var(--line);
    }

    .menu-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid rgba(49, 75, 53, .85);
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .menu-row.active {
      background: rgba(14, 28, 14, .98);
      box-shadow: inset 0 -1px 0 #1a301a, inset 0 1px 0 #1a301a;
      color: var(--hot);
    }

    .menu-row.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 5px;
      bottom: 5px;
      width: 3px;
      background: var(--gold);
    }

    .menu-row span:last-child {
      color: var(--dim);
      font-size: 18px;
    }

    .angle-card {
      position: relative;
      background: rgba(5, 10, 5, .72);
      border-top: 1px solid var(--gold-dim);
      border-bottom: 1px solid rgba(154,136,86,.35);
      overflow: hidden;
    }

    .angle-card::before {
      content: "";
      position: absolute;
      left: 9%;
      right: 8%;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--neutral), transparent);
      opacity: .85;
    }

    .angle-card::after {
      content: "";
      position: absolute;
      left: 13%;
      top: 18%;
      width: 1px;
      height: 64%;
      background: rgba(154,136,86,.42);
    }

    .title {
      position: absolute;
      top: 16px;
      left: 18px;
      display: flex;
      gap: 14px;
      align-items: baseline;
    }

    .title strong {
      color: var(--gold);
      font-size: 21px;
      font-weight: 800;
    }

    .title span {
      color: var(--dim);
      font-size: 17px;
    }

    .scale {
      position: absolute;
      left: 10%;
      top: 50%;
      width: min(58%, 520px);
      height: min(58%, 300px);
      transform: translateY(-50%);
    }

    .angle-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 84%;
      height: 1px;
      transform-origin: 50% 50%;
      background: rgba(95,125,93,.58);
    }

    .angle-line.up { transform: translate(-50%, -50%) rotate(-45deg); opacity: .36; }
    .angle-line.down { transform: translate(-50%, -50%) rotate(45deg); opacity: .36; }

    .tick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      border: 1px solid var(--gold);
      background: var(--bg);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      z-index: 5;
    }

    .blade {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 82%;
      height: 30px;
      transform-origin: 50% 50%;
      border: 1px solid currentColor;
      clip-path: polygon(4% 50%, 12% 16%, 88% 16%, 96% 50%, 88% 84%, 12% 84%);
      box-shadow: 0 0 18px currentColor;
      mix-blend-mode: screen;
    }

    .blade.left {
      color: var(--left);
      background: rgba(155,230,154,.38);
      transform: translate(-50%, -50%) rotate(-18deg);
      animation: leftCanard 4.2s ease-in-out infinite;
    }

    .blade.right {
      color: var(--right);
      background: rgba(215,188,108,.36);
      transform: translate(-50%, -50%) rotate(12deg);
      animation: rightCanard 4.2s ease-in-out infinite;
    }

    .neutral-blade {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 82%;
      height: 2px;
      background: var(--neutral);
      transform: translate(-50%, -50%);
      opacity: .75;
    }

    .label {
      position: absolute;
      font-size: 19px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .label.up { left: calc(10% + 16px); top: 18%; color: var(--dim); }
    .label.zero { left: calc(10% + 16px); top: calc(50% + 9px); color: var(--dim); }
    .label.down { left: calc(10% + 16px); bottom: 18%; color: var(--dim); }

    .readouts {
      position: absolute;
      right: 22px;
      top: 78px;
      bottom: 24px;
      width: 178px;
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
    }

    .metric {
      border-left: 1px solid var(--line);
      padding-left: 12px;
      display: grid;
      align-content: center;
    }

    .metric span {
      color: var(--dim);
      font-size: 17px;
      font-weight: 700;
    }

    .metric strong {
      color: var(--hot);
      font-size: 34px;
      line-height: 1.05;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .metric.left strong { color: var(--left); }
    .metric.right strong { color: var(--right); }

    .status-side {
      border-left: 1px solid var(--line-bright);
      padding-left: 12px;
      display: grid;
      grid-template-rows: 1.3fr .8fr .8fr;
      gap: 10px;
    }

    .status-card {
      border: 1px solid var(--line);
      background: rgba(7, 16, 8, .75);
      padding: 12px;
    }

    .status-card h2 {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 18px;
    }

    .ship-mini {
      height: 118px;
      position: relative;
      border-top: 1px solid var(--gold-dim);
      border-bottom: 1px solid rgba(154,136,86,.34);
    }

    .ship-mini::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 11px;
      width: 46px;
      height: 96px;
      transform: translateX(-50%);
      border: 1px solid rgba(128,189,128,.5);
      background: rgba(70,120,70,.16);
      clip-path: polygon(50% 0, 100% 18%, 76% 100%, 24% 100%, 0 18%);
    }

    .status-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--dim);
      font-size: 18px;
      margin-top: 9px;
    }

    .status-line strong {
      color: var(--hot);
      font-variant-numeric: tabular-nums;
    }

    .rail {
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
    }

    .cmd {
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 13px;
      display: grid;
      align-content: center;
      min-height: 100px;
      box-shadow: inset 0 0 24px rgba(80,160,80,.035);
    }

    .cmd.active {
      border-color: var(--gold);
      background: linear-gradient(180deg, rgba(154,136,86,.13), rgba(7,16,8,.96));
      box-shadow: inset 3px 0 0 var(--gold), inset 0 0 24px rgba(154,136,86,.07);
    }

    .cmd .index {
      color: var(--gold);
      font-size: 18px;
      font-weight: 800;
    }

    .cmd .label {
      position: static;
      color: var(--hot);
      font-size: 34px;
      line-height: .95;
      margin-top: 7px;
      font-weight: 800;
    }

    .cmd .value {
      color: var(--dim);
      font-size: 18px;
      margin-top: 9px;
      font-variant-numeric: tabular-nums;
    }

    @keyframes leftCanard {
      0%, 100% { transform: translate(-50%, -50%) rotate(-18deg); }
      50% { transform: translate(-50%, -50%) rotate(24deg); }
    }

    @keyframes rightCanard {
      0%, 100% { transform: translate(-50%, -50%) rotate(12deg); }
      50% { transform: translate(-50%, -50%) rotate(-14deg); }
    }
  </style>
</head>
<body>
  <section class="mfd" aria-label="Canards MFD concept">
    <header>
      <div class="brand">NYINAH CORP</div>
      <div class="sys">TACTICAL SYSTEM 3840/4022/6110</div>
      <div class="page">CANARDS</div>
    </header>

    <main>
      <section class="menu-stack">
        <div class="menu-list">
          <div class="menu-row active"><span>Canards [AUTO]</span><span>01</span></div>
          <div class="menu-row"><span>Gain- [1.5]</span><span>02</span></div>
          <div class="menu-row"><span>Gain+ [1.5]</span><span>03</span></div>
        </div>

        <section class="angle-card">
          <div class="title">
            <strong>SIDE TILT</strong>
            <span>L/R surfaces overlaid, center pivot</span>
          </div>

          <div class="label up">+45</div>
          <div class="label zero">0</div>
          <div class="label down">-45</div>

          <div class="scale">
            <div class="angle-line up"></div>
            <div class="angle-line down"></div>
            <div class="neutral-blade"></div>
            <div class="blade left"></div>
            <div class="blade right"></div>
            <div class="tick"></div>
          </div>

          <div class="readouts">
            <div class="metric left"><span>L CMD</span><strong>-18.4</strong></div>
            <div class="metric right"><span>R CMD</span><strong>+12.8</strong></div>
            <div class="metric"><span>GAIN</span><strong>1.5</strong></div>
            <div class="metric"><span>STATUS</span><strong>ON</strong></div>
          </div>
        </section>
      </section>

      <aside class="status-side">
        <section class="status-card">
          <h2>AIRFRAME</h2>
          <div class="ship-mini"></div>
          <div class="status-line"><span>BLOCKS</span><strong>214/214</strong></div>
        </section>
        <section class="status-card">
          <h2>FUEL</h2>
          <div class="status-line"><span>H2</span><strong>82%</strong></div>
          <div class="status-line"><span>TIME</span><strong>18:40</strong></div>
        </section>
        <section class="status-card">
          <h2>POWER</h2>
          <div class="status-line"><span>BAT</span><strong>91%</strong></div>
          <div class="status-line"><span>NET</span><strong>-0.2</strong></div>
        </section>
      </aside>
    </main>

    <footer>
      <span>1 UP  2 DN  3 SEL  4 BACK</span>
      <span>CANARD CONTROL</span>
    </footer>
  </section>
</body>
</html>
