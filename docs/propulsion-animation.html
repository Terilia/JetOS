<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>JetOS Engine Visualization — 1:1 StatusPanelRenderer</title>
<style>
  body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { image-rendering: auto; }
</style>
</head><body>
<canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════════════════════
// 1:1 port of StatusPanelRenderer.cs + DrawTurbineDisc
// Every drawing call, color, and formula is identical to the C#.
// ═══════════════════════════════════════════════════════════════

const S = 3; // scale factor for visibility (3x game pixels)

// Panel area in game coordinates (matches MFD sidebar)
const AREA = { x: 0, y: 0, w: 200, h: 400 };

const canvas = document.getElementById('c');
canvas.width = AREA.w * S;
canvas.height = AREA.h * S;
const ctx = canvas.getContext('2d');

// ── MFDTheme colors (exact from UIController.cs) ──
const T = {
  BG:          [5,8,5],
  PANEL_BG:    [8,14,8],
  HEADER_BG:   [10,18,10],
  BORDER:      [24,40,24],
  BORDER_LIGHT:[20,30,20],
  DIM_TEXT:    [42,74,42],
  DIM_TEXT_MID:[58,90,58],
  MID_TEXT:    [74,122,74],
  NORMAL_TEXT: [90,154,90],
  BRIGHT_TEXT: [144,208,144],
  ACCENT:      [64,160,64],
  CORP_GOLD:   [138,122,80],
  BAR_TRACK:   [6,10,6],
  BAR_FILL:    [48,144,48],
  STATUS_VAL:  [80,144,80],
  WARN:        [192,160,48],
};

// Engine schematic colors (exact)
const C_ENG_BODY = [20,35,20];
const C_ENG_LINE = [40,70,40];

const PHI = 1.6180339887;
const TWO_PI = Math.PI * 2;

// ── Simulation state ──
let tick = 0;
let thrControl = 0;     // 0..1 throttle
let abActive = false;
let abActiveTicks = 0;
let lastAbState = false;
let smoothedVel = 60;
let smoothedYawDrift = 0;
let smoothedPitchDrift = 0;

// Throttle auto-cycle: ramp up to MIL, pause, AB, pause, ramp down
let phase = 0; // 0=idle→MIL, 1=hold MIL, 2=MIL→AB, 3=hold AB, 4=AB→idle, 5=hold idle

// ── Drawing primitives (matching SE sprite system) ──
function rgba(c, a) {
  if (a === undefined) a = 255;
  return `rgba(${c[0]},${c[1]},${c[2]},${(a/255).toFixed(3)})`;
}

function Rect(cx, cy, w, h, color, alpha) {
  ctx.fillStyle = (alpha !== undefined) ? rgba(color, alpha) : rgba(color);
  ctx.fillRect((cx - w/2) * S, (cy - h/2) * S, w * S, h * S);
}

function RectRGBA(cx, cy, w, h, r, g, b, a) {
  ctx.fillStyle = `rgba(${r},${g},${b},${(a/255).toFixed(3)})`;
  ctx.fillRect((cx - w/2) * S, (cy - h/2) * S, w * S, h * S);
}

function DrawRectangleOutline(x, y, w, h, thickness, color) {
  const c = rgba(color);
  ctx.fillStyle = c;
  // top
  ctx.fillRect(x * S, y * S, w * S, thickness * S);
  // bottom
  ctx.fillRect(x * S, (y + h - thickness) * S, w * S, thickness * S);
  // left
  ctx.fillRect(x * S, y * S, thickness * S, h * S);
  // right
  ctx.fillRect((x + w - thickness) * S, y * S, thickness * S, h * S);
}

function Txt(text, x, y, scale, color, align) {
  // SE font scale: ~28px at scale 1.0 on 512x512
  const fontSize = scale * 28;
  ctx.font = `${fontSize * S}px monospace`;
  ctx.fillStyle = rgba(color);
  ctx.textBaseline = 'top';
  if (align === 'center') ctx.textAlign = 'center';
  else if (align === 'right') ctx.textAlign = 'right';
  else ctx.textAlign = 'left';
  ctx.fillText(text, x * S, y * S);
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ═══════════════════════════════════════════════════════════════
// DrawTurbineDisc — exact port of StatusPanelRenderer.cs:148-201
// ═══════════════════════════════════════════════════════════════
function DrawTurbineDisc(schX, cy, radius, numBlades, rotAngle, bladeChord,
                         bladeR, bladeG, bladeB, bladeA,
                         hubR, hubG, hubB, damaged) {
  if (damaged) return;
  const hubRad = radius * 0.18;

  // Back blades (sinA < 0)
  for (let b = 0; b < numBlades; b++) {
    const bAngle = rotAngle + b / numBlades * TWO_PI;
    const cosA = Math.cos(bAngle);
    const sinA = Math.sin(bAngle);
    if (sinA >= 0) continue;

    const tipX = cosA * radius;
    const hubTipX = cosA * hubRad;
    const apparentH = 0.8 + Math.abs(sinA) * bladeChord * 1.5;
    const depthAlpha = 0.3 + (sinA + 1) * 0.35;
    const alpha = Math.floor(bladeA * depthAlpha);
    const bladeLen = Math.abs(tipX - hubTipX);
    const bladeCX = schX + (tipX + hubTipX) / 2;
    if (bladeLen > 0.3)
      RectRGBA(bladeCX, cy, bladeLen, apparentH,
        Math.max(0, bladeR - 15), Math.max(0, bladeG - 15), Math.max(0, bladeB - 10), alpha);
  }

  // Hub
  RectRGBA(schX, cy, hubRad * 1.6, hubRad * 1.6, hubR, hubG, hubB, 140);
  RectRGBA(schX, cy, hubRad * 0.6, hubRad * 0.6,
    Math.min(255, hubR + 20), Math.min(255, hubG + 20), Math.min(255, hubB + 15), 100);

  // Front blades (sinA >= 0)
  for (let b = 0; b < numBlades; b++) {
    const bAngle = rotAngle + b / numBlades * TWO_PI;
    const cosA = Math.cos(bAngle);
    const sinA = Math.sin(bAngle);
    if (sinA < 0) continue;

    const tipX = cosA * radius;
    const hubTipX = cosA * hubRad;
    const apparentH = 0.8 + Math.abs(sinA) * bladeChord * 1.5;
    const depthAlpha = 0.3 + (sinA + 1) * 0.35;
    const alpha = Math.floor(bladeA * depthAlpha);
    const bladeLen = Math.abs(tipX - hubTipX);
    const bladeCX = schX + (tipX + hubTipX) / 2;
    if (bladeLen > 0.3)
      RectRGBA(bladeCX, cy, bladeLen, apparentH, bladeR, bladeG, bladeB, alpha);
  }
}

// ═══════════════════════════════════════════════════════════════
// DrawEngineCol — exact port of StatusPanelRenderer.cs:203-532
// ═══════════════════════════════════════════════════════════════
function DrawEngineCol(x, y, w, availH, label, thr, ab, tick, velocity) {
  // Simulated engine health: 3 engines, all functional
  const fn = 3, tot = 3;
  // Simulated thrust: proportional to throttle
  const maxKN = 300;
  const curKN = maxKN * Math.min(thr / 0.8, 1.0);
  const abMax = ab ? 200 : 0;
  const abCur = ab ? 200 : 0;
  const totalMax = maxKN + (ab ? 200 : 0);
  const totalCur = curKN + abCur;
  const thrustPct = totalMax > 0 ? totalCur / totalMax : 0;

  const hpC = fn >= tot ? T.ACCENT : T.WARN;

  // ── Label + health ──
  Txt(label, x, y, 0.35, T.MID_TEXT, 'left');
  Txt(`${fn}/${tot}`, x + w, y, 0.32, hpC, 'right');

  // ── Engine schematic layout ──
  const schTop = y + 13;
  let schH = (availH - 30) * 0.75;
  if (schH < 10) schH = 10;
  const schW = 18;
  const schX = x + w / 2;
  const seed = label === "ENG L" ? 0 : 1.7;

  // ── Intake funnel ──
  const intakeH = schH * 0.08;
  const intakeW = schW * 1.3;
  Rect(schX, schTop + intakeH / 2, intakeW, intakeH, C_ENG_BODY);
  Rect(schX, schTop, intakeW, 0.5, C_ENG_LINE);

  // ── Compressor body ──
  const bodyTop = schTop + intakeH;
  const bodyH = schH * 0.45;
  Rect(schX, bodyTop + bodyH / 2, schW, bodyH, C_ENG_BODY);
  const segs = Math.max(Math.min(tot, 5), 2);
  const segH = bodyH / segs;
  for (let s = 1; s < segs; s++)
    Rect(schX, bodyTop + s * segH, schW - 2, 0.5, C_ENG_LINE);

  // Health: damaged segments blink
  for (let s = 0; s < segs; s++) {
    const dmg = Math.floor(s * tot / segs) >= fn;
    if (dmg && Math.floor(tick / 10) % 2 === 0)
      RectRGBA(schX, bodyTop + s * segH + segH / 2, schW - 2, segH - 1, 60, 20, 15, 255);
  }
  DrawRectangleOutline(schX - schW / 2, bodyTop, schW, bodyH, 0.5, C_ENG_LINE);

  // ── Combustion chamber ──
  const combTop = bodyTop + bodyH;
  const combH = schH * 0.15;
  const combW = schW + 2;
  const glowR = Math.floor(20 + (55 - 20) * thrustPct);
  const glowG = Math.floor(35 + (40 - 35) * thrustPct);
  const glowB = Math.max(0, Math.floor(20 + (15 - 20) * thrustPct));
  RectRGBA(schX, combTop + combH / 2, combW, combH, glowR, glowG, glowB, 255);
  DrawRectangleOutline(schX - combW / 2, combTop, combW, combH, 0.5, C_ENG_LINE);

  // ── Central shaft ──
  const shaftTop = schTop + intakeH * 0.3;
  const shaftBot = combTop + combH * 0.9;
  RectRGBA(schX, (shaftTop + shaftBot) / 2, 1.5, shaftBot - shaftTop, 35, 55, 35, 100);
  RectRGBA(schX, (shaftTop + shaftBot) / 2, 0.5, shaftBot - shaftTop, 55, 80, 55, 70);

  // ── 3D Compressor blade discs ──
  const spinSpeed = 0.04 + thrustPct * 0.22;
  const stageRadius = (schW - 4) / 2;
  for (let s = 0; s < segs; s++) {
    const dmg = Math.floor(s * tot / segs) >= fn;
    const stageCY = bodyTop + s * segH + segH / 2;
    const numBlades = 12 + s * 4;
    const direction = (s % 2 === 0) ? 1 : -1;
    const chord = 2.5 - s * 0.3;
    const rot = tick * spinSpeed * direction + s * 0.9 + seed;
    DrawTurbineDisc(schX, stageCY, stageRadius, numBlades, rot, chord,
      70, 120, 70, 180, 45, 75, 45, dmg);
  }

  // ── 3D Turbine discs in combustion chamber ──
  const turbRadius = (combW - 4) / 2;
  const turbSpinSpeed = spinSpeed * 0.7;
  for (let ts = 0; ts < 2; ts++) {
    const turbCY = combTop + combH * (0.3 + ts * 0.4);
    const heat = 1 - ts * 0.3;
    const hR = Math.floor(80 + thrustPct * 70 * heat);
    const hG = Math.floor(65 + thrustPct * 30 * heat);
    const dir = (ts % 2 === 0) ? 1 : -1;
    const rot = tick * turbSpinSpeed * dir + ts * 1.5 + seed + 3;
    DrawTurbineDisc(schX, turbCY, turbRadius, 8, rot, 2.0,
      hR, hG, 40, 160, Math.max(0, hR - 20), Math.max(0, hG - 15), 30, false);
  }

  // ── Nozzle ──
  const nozzTop = combTop + combH;
  const nozzH = schH * 0.12;
  const nozzWTop = schW;
  const nozzWBot = schW * 0.5;
  for (let i = 0; i < 3; i++) {
    const nt = i / 3;
    const slW = lerp(nozzWTop, nozzWBot, nt);
    const slY = nozzTop + nozzH * nt + nozzH / 6;
    RectRGBA(schX, slY, slW, nozzH / 3, 15, 22, 15, 255);
  }

  // ═══ Air particles ═══
  const velFactor = clamp(velocity / 100.0, 0, 1);
  const flowBotY = combTop + combH;
  const approachTopY = schTop - 20;
  const flowTotalH = flowBotY - approachTopY;
  const numParticles = 48;
  const pSpeed = Math.max(0.003, 0.003 + thrustPct * 0.018);

  for (let p = 0; p < numParticles; p++) {
    const rawPhase = (tick * pSpeed + p * PHI) % 1;
    const warpedPhase = rawPhase * rawPhase * (3 - 2 * rawPhase);
    const py = approachTopY + warpedPhase * flowTotalH;

    let px, pDepth;

    if (py < schTop) {
      // APPROACH: funnel toward intake
      const approachT = clamp((schTop - py) / 20, 0, 1);
      const laneAngle = p * PHI * 3.7;
      const lane = Math.sin(laneAngle) * 0.9;
      const entryOffset = Math.cos(laneAngle * 1.3 + 0.7) * 0.4;
      const farX = schX + (lane + entryOffset) * schW * 1.8 * 0.5;
      const intakeSlot = lane * intakeW * 0.35;
      const nearX = schX + intakeSlot;
      px = lerp(nearX, farX, approachT * approachT);
      pDepth = 0.5;
    } else {
      // INSIDE ENGINE: spiral with blade rotation
      const relY = py - bodyTop;
      const stageIdx = Math.floor(relY / segH);
      const inCompressor = (relY >= 0 && stageIdx < segs);

      let spiralAngle;
      if (inCompressor) {
        const dir = (stageIdx % 2 === 0) ? 1 : -1;
        const stageSpeedMul = 1 + stageIdx * 0.25;
        const stageRot = tick * spinSpeed * stageSpeedMul * dir + stageIdx * 0.9 + seed;
        spiralAngle = stageRot + p * (TWO_PI / numParticles);
      } else {
        spiralAngle = tick * spinSpeed * 1.5 + p * 1.3 + warpedPhase * 5;
      }

      const maxR = (schW - 3) / 2;
      const depthProgress = clamp((py - bodyTop) / (flowBotY - bodyTop), 0, 1);
      const compressionFactor = 1 - depthProgress * 0.6;
      const radiusWobble = 0.6 + Math.sin(p * 2.7 + tick * 0.05) * 0.2;
      const spiralR = maxR * radiusWobble * compressionFactor;

      const driftInfluence = depthProgress * 0.6;
      px = schX + Math.cos(spiralAngle) * spiralR + smoothedYawDrift * driftInfluence;
      pDepth = Math.sin(spiralAngle);
    }

    // Size
    const insideEng = py >= bodyTop;
    const stageDepth = insideEng ? clamp((py - bodyTop) / (flowBotY - bodyTop), 0, 1) : 0;
    const compressionSize = 1 + stageDepth * 0.8;
    const pW = (1.0 + (pDepth + 1) * 0.4 + (p % 2) * 0.3) * compressionSize;
    const pH = (1.2 + velFactor * 1.0) * compressionSize;

    // Alpha
    let edgeFade;
    if (warpedPhase < 0.1) edgeFade = warpedPhase / 0.1;
    else if (warpedPhase > 0.85) edgeFade = (1 - warpedPhase) / 0.15;
    else edgeFade = 1;
    const depthBright = 0.5 + (pDepth + 1) * 0.25;
    const pAlpha = Math.floor((0.2 + thrustPct * 0.8) * 130 * edgeFade * depthBright);

    if (pAlpha > 4) {
      const heatProgress = Math.max(0, (warpedPhase - 0.15) / 0.85);
      const pR = Math.floor(55 + heatProgress * 45);
      const pG = Math.floor(130 + (p % 3) * 15 - heatProgress * 25);
      const pB = Math.floor(55 + heatProgress * 15);
      RectRGBA(px, py, pW, pH, pR, pG, pB, pAlpha);
    }
  }

  // ═══ Exhaust plume ═══
  const exhaTop = nozzTop + nozzH;
  const maxPlumeH = schH * 0.3;
  const nozzExitW = nozzWBot * 0.8;

  let flameStage = 0;
  if (ab && abCur > 0.1) flameStage = 2;
  else if (thrustPct > 0.70) flameStage = 1;

  if (thrustPct > 0.01) {
    const driftX = smoothedYawDrift;
    const driftY = smoothedPitchDrift;

    let basePlumeH = maxPlumeH * thrustPct * (1 + velFactor * 0.25);
    if (flameStage === 2) basePlumeH *= 1.3;
    const tongues = thrustPct > 0.5 ? 3 : 2;
    const slices = flameStage === 2 ? 10 : (thrustPct > 0.4 ? 12 : 8);

    // Outer glow envelope
    for (let sl = 0; sl < 6; sl++) {
      const gt = sl / 5;
      const gs1 = Math.sin(tick * 0.23 + sl * 1.7 + seed);
      const gY = exhaTop + basePlumeH * gt * 0.8 + 1 + driftY * gt * gt;
      const gX = schX + driftX * gt * gt + gs1 * 0.5;
      let gW = nozzExitW * (1.2 - gt * 0.8) + gs1 * 0.5;
      gW *= 1 - velFactor * 0.15 * gt;
      const gA = Math.floor(30 * (1 - gt * gt));
      if (gA < 3) continue;
      if (flameStage === 2)
        RectRGBA(gX, gY, gW, basePlumeH / 5, Math.floor(lerp(120,60,gt)), Math.floor(lerp(70,30,gt)), 10, gA);
      else
        RectRGBA(gX, gY, gW, basePlumeH / 5, 20, Math.floor(lerp(50,25,gt)), Math.floor(lerp(90,40,gt)), gA);
    }

    // Flame tongues
    for (let tongue = 0; tongue < tongues; tongue++) {
      const tseed = seed + tongue * 2.17;
      let tongueBaseX = 0;
      if (tongues === 3) tongueBaseX = (tongue - 1) * nozzExitW * 0.2;
      else if (tongues === 2) tongueBaseX = (tongue - 0.5) * nozzExitW * 0.15;
      const tongueLenMul = tongue === Math.floor(tongues / 2)
        ? 1 : 0.75 + Math.sin(tick * 0.13 + tseed) * 0.1;

      for (let sl = 0; sl < slices; sl++) {
        const t = sl / (slices - 1);
        const s1 = Math.sin(tick * 0.41 + sl * 0.9 + tseed);
        const s2 = Math.sin(tick * 0.67 + sl * 1.3 + tseed * 1.4);
        const s3 = Math.sin(tick * 0.23 + sl * 2.1 + tseed * 0.7);

        let tw = nozzExitW * 0.35 * (1 - t * 0.85);
        tw *= 1 - velFactor * 0.2 * t;
        tw += tw * s2 * 0.15;
        tw = Math.max(tw, 0.3);

        let slH = basePlumeH * tongueLenMul / slices * 1.3;
        slH += slH * s1 * 0.08;
        slH = Math.max(slH, 0.3);

        const wobbleDamp = 1 - velFactor * 0.5;
        let wx = tongueBaseX + s3 * tw * 0.4 * wobbleDamp + s1 * 1.2 * wobbleDamp;
        wx += driftX * t * t;

        let slY = exhaTop + basePlumeH * tongueLenMul * t * 0.85 + slH * 0.3;
        slY += s1 * 1.5 + driftY * t * t;
        const slX = schX + wx;

        let cR, cG, cB, cA;
        switch (flameStage) {
          case 2:
            cR = Math.floor(lerp(255,140,t)); cG = Math.floor(lerp(220,50,t));
            cB = Math.floor(lerp(130,10,t)); cA = Math.floor(lerp(200,30,t*t));
            if (t < 0.2) { cR = Math.min(255, cR + Math.floor(s2*20)); cG = Math.min(255, cG + Math.floor(s2*15)); }
            break;
          case 1:
            if (t < 0.12) { cR = Math.floor(lerp(210,140,t/0.12)); cG = Math.floor(lerp(235,190,t/0.12)); cB = 255; cA = 210; }
            else if (t < 0.45) { const mt = (t-0.12)/0.33; cR = Math.floor(lerp(140,40,mt)); cG = Math.min(255, Math.floor(lerp(190,110,mt)) + Math.floor(s2*8)); cB = Math.min(255, Math.floor(lerp(255,220,mt)) + Math.floor(s1*6)); cA = Math.floor(lerp(200,150,mt)); }
            else { const mt = (t-0.45)/0.55; cR = Math.floor(lerp(40,15,mt)); cG = Math.floor(lerp(110,50,mt)); cB = Math.floor(lerp(220,110,mt)); cA = Math.floor(lerp(150,20,mt*mt)); }
            break;
          default:
            cR = Math.floor(lerp(50,15,t)); cG = Math.floor(lerp(100,40,t));
            cB = Math.floor(lerp(180,80,t)); cA = Math.floor(lerp(120,15,t*t));
            break;
        }
        RectRGBA(slX, slY, tw, slH, cR, cG, cB, cA);
      }
    }

    // Hot core
    for (let c = 0; c < 4; c++) {
      const ct = c / 3;
      const cs1 = Math.sin(tick * 0.5 + c * 1.3 + seed);
      const coreY = exhaTop + basePlumeH * ct * 0.5 + 1 + driftY * ct * ct;
      const coreX = schX + driftX * ct * ct + cs1 * 0.3;
      const coreW = nozzExitW * 0.15 * (1 - ct * 0.6);
      const coreH = basePlumeH * 0.15;
      const coreA = Math.floor(180 * (1 - ct));
      if (flameStage === 2) RectRGBA(coreX, coreY, coreW, coreH, 255, 240, 180, coreA);
      else if (flameStage === 1) RectRGBA(coreX, coreY, coreW, coreH, 200, 230, 255, coreA);
      else RectRGBA(coreX, coreY, coreW, coreH, 100, 150, 220, Math.floor(coreA * 0.5));
    }

    // Nozzle glow
    const glowPulse = Math.sin(tick * 0.37 + seed) * 0.1;
    const glowSize = nozzExitW * (1.0 + glowPulse);
    if (flameStage === 2) RectRGBA(schX, exhaTop + 1, glowSize, 2.5, 200, 150, 40, 110);
    else if (flameStage === 1) RectRGBA(schX, exhaTop + 1, glowSize, 2.5, 120, 170, 230, 90);
    else RectRGBA(schX, exhaTop + 1, glowSize, 2.5, 50, 90, 160, 50);
  }

  // ── Thrust bar ──
  const barY = y + availH - 14;
  const barH2 = 3;
  Rect(x + w / 2, barY + barH2 / 2, w, barH2, T.BAR_TRACK);
  DrawRectangleOutline(x, barY, w, barH2, 0.5, T.BORDER);
  const fillW = w * thrustPct;
  if (fillW > 0.5)
    Rect(x + fillW / 2, barY + barH2 / 2, fillW, barH2, T.BAR_FILL);

  const thrTxt = totalMax > 0 ? `${Math.floor(totalCur)}/${Math.floor(totalMax)}kN` : "---";
  Txt(thrTxt, x + w, barY + barH2 + 1, 0.28, T.STATUS_VAL, 'right');
}

// ═══════════════════════════════════════════════════════════════
// DrawPropulsionCard — exact port
// ═══════════════════════════════════════════════════════════════
function DrawPropulsionCard(x, y, w, h, thr, ab, tick, velocity) {
  Rect(x + w / 2, y + h / 2, w, h, T.PANEL_BG);
  DrawRectangleOutline(x, y, w, h, 1, T.BORDER_LIGHT);
  Txt("PROPULSION", x + w / 2, y + 2, 0.32, T.DIM_TEXT, 'center');

  const colW = (w - 14) / 2;
  const colTop = y + 14;
  const colH = h - 18;

  DrawEngineCol(x + 4, colTop, colW, colH, "ENG L", thr, ab, tick, velocity);
  DrawEngineCol(x + w - colW - 4, colTop, colW, colH, "ENG R", thr, ab, tick, velocity);
}

// ═══════════════════════════════════════════════════════════════
// DrawResourceCard — exact port
// ═══════════════════════════════════════════════════════════════
function DrawResourceCard(x, y, w, h, title, pct, timeStr) {
  Rect(x + w / 2, y + h / 2, w, h, T.PANEL_BG);
  DrawRectangleOutline(x, y, w, h, 1, T.BORDER_LIGHT);

  Txt(title, x + 4, y + 2, 0.32, T.DIM_TEXT_MID, 'left');
  Txt(`${Math.floor(pct * 100)}%`, x + w - 4, y + 1, 0.38, T.STATUS_VAL, 'right');

  const barY = y + 14;
  const barW = w - 8;
  const barH = 4;
  const barX = x + 4;
  Rect(barX + barW / 2, barY + barH / 2, barW, barH, T.BAR_TRACK);
  DrawRectangleOutline(barX, barY, barW, barH, 0.5, T.BORDER);
  const fillW = barW * clamp(pct, 0, 1);
  if (fillW > 0.5)
    Rect(barX + fillW / 2, barY + barH / 2, fillW, barH, T.BAR_FILL);

  Txt("REMAIN", barX, barY + barH + 2, 0.28, T.DIM_TEXT, 'left');
  Txt(timeStr, barX + barW, barY + barH + 2, 0.28, T.STATUS_VAL, 'right');
}

// ═══════════════════════════════════════════════════════════════
// Main render + throttle simulation
// ═══════════════════════════════════════════════════════════════
const PHASE_DURATIONS = [240, 120, 60, 180, 120, 180]; // ticks per phase
let phaseTick = 0;

function updateThrottle() {
  phaseTick++;
  if (phaseTick > PHASE_DURATIONS[phase]) {
    phaseTick = 0;
    phase = (phase + 1) % 6;
  }
  const t = phaseTick / PHASE_DURATIONS[phase];

  switch (phase) {
    case 0: thrControl = lerp(0, 0.8, t); break;          // idle → MIL
    case 1: thrControl = 0.8; break;                       // hold MIL
    case 2: thrControl = lerp(0.8, 1.0, t); break;        // MIL → AB
    case 3: thrControl = 1.0; break;                       // hold AB
    case 4: thrControl = lerp(1.0, 0, t); break;           // AB → idle
    case 5: thrControl = 0; break;                          // hold idle
  }

  abActive = thrControl > 0.8;

  // AB visual delay (exact from C#)
  if (abActive) {
    if (!lastAbState) abActiveTicks = 0;
    abActiveTicks++;
  } else {
    abActiveTicks = 0;
  }
  lastAbState = abActive;

  // Smoothed velocity correlates with thrust
  const targetVel = thrControl * 100;
  smoothedVel = smoothedVel * 0.95 + targetVel * 0.05;
}

function draw() {
  tick++;
  updateThrottle();

  const abVisual = abActive && abActiveTicks > 2;

  // Clear
  ctx.fillStyle = rgba(T.BG);
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Layout (matching Render() logic)
  const x = AREA.x, w = AREA.w;
  let y = AREA.y;
  const areaH = AREA.h;
  const gap = 6;
  const resH = 36;
  const resCount = 2; // H2 + Battery
  const resTotal = resCount * (resH + gap);
  const maxPropH = areaH - resTotal;
  let propH = maxPropH * 0.75;
  if (propH < 50) propH = 50;

  DrawPropulsionCard(x, y, w, propH, thrControl, abVisual, tick, smoothedVel);
  y += propH + gap;

  // H2 fuel (simulated: slowly depleting)
  const fuelPct = 0.72 - (tick % 6000) / 60000;
  const fuelSec = fuelPct * 600;
  const fuelMins = Math.floor(fuelSec / 60);
  const fuelSecsR = Math.floor(fuelSec % 60);
  DrawResourceCard(x, y, w, resH, "H2 FUEL", fuelPct,
    `${String(fuelMins).padStart(2,'0')}:${String(fuelSecsR).padStart(2,'0')}`);
  y += resH + gap;

  // Battery (simulated)
  DrawResourceCard(x, y, w, resH, "BATTERY", 0.85, "02:34");

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
