<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Master Warning chiclet — outlined rounded rect with thicker stroke + bold "MW"
       letters and corner brackets so it visually outweighs the Master Caution chiclet.
       Tinted red/amber by the script. -->
  <rect x="20" y="60" width="216" height="136" rx="20" stroke="#FFFFFF" stroke-width="16"/>
  <text x="128" y="158" font-family="Arial Black, sans-serif" font-size="84" font-weight="900"
        text-anchor="middle" fill="#FFFFFF" letter-spacing="2">MW</text>
  <!-- Inner attention ticks at top + bottom mid -->
  <rect x="116" y="60" width="24" height="6" fill="#FFFFFF"/>
  <rect x="116" y="190" width="24" height="6" fill="#FFFFFF"/>
</svg>
